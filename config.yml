# config.yml - MODO INTELIGENTE (Spacy + Jerga)
recipe: default.v1
language: en
assistant_id: 20251105-smart-bot

pipeline:
  # 1. CEREBRO: Carga el modelo de inglés que instalaste
  - name: SpacyNLP
    model: "en_core_web_md"

  # 2. TOKENIZER: Separa mejor las palabras (ej: "I'm", "can't")
  - name: SpacyTokenizer

  # 3. CONTEXTO: Entiende sinónimos matemáticos (ej: "apparel" ≈ "clothing")
  - name: SpacyFeaturizer
    pooling: mean

  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer

  # 4. PALABRAS EXACTAS: Sigue entendiendo tus comandos precisos
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2

  # 5. ORTOGRAFÍA: Ayuda con errores de dedo (ej: "sheeet", "prrice")
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 3
    max_ngram: 5

  # 6. CLASIFICADOR: El corazón del bot
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
    model_confidence: softmax

  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    retrieval_intent: faq
    constrain_similarities: true

  - name: DucklingEntityExtractor
    url: "http://localhost:8000"
    dimensions: ["number", "email"]

  # 7. FILTRO FLEXIBLE: Bajamos la exigencia a 0.6 para aceptar jerga
  - name: FallbackClassifier
    threshold: 0.6
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: True
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
