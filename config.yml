recipe: default.v1
language: en
assistant_id: 20251105-smart-bot

pipeline:
  - name: SpacyNLP
    model: "en_core_web_md"
  - name: SpacyTokenizer
  - name: SpacyFeaturizer
    pooling: mean
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer

  # Captura palabras exactas
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2

  # Captura partes de palabras (AYUDA CON JERGAS Y ERRORES DE DEDO)
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 2 # Cambiado de 3 a 2 para capturar sílabas más cortas
    max_ngram: 5

  # El cerebro principal
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
    model_confidence: softmax
    # Agregamos esto para dar peso a las palabras que sí conoce
    use_masked_language_model: True

  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    retrieval_intent: faq
    constrain_similarities: true

  - name: DucklingEntityExtractor
    url: "http://localhost:8000"
    dimensions: ["number", "email"]

  # Si la confianza es menor a 0.5, usa fallback.
  # (Antes tenías 0.6, bajarlo a 0.5 permite que entienda jergas dudosas)
  - name: FallbackClassifier
    threshold: 0.5
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: True
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
