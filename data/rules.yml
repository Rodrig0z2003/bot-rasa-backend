version: "3.1"

rules:
  - rule: Respond to bot_challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  # --- REGLAS DE CHIT-CHAT ---
  - rule: Respond to thankyou
    steps:
      - intent: thankyou
      - action: utter_you_are_welcome

  - rule: Respond to compliment
    steps:
      - intent: compliment
      - action: utter_good_bot

  - rule: Respond to ask_how_are_you
    steps:
      - intent: ask_how_are_you
      - action: utter_how_are_you

  # --- REGLAS DEL FORMULARIO DE PEDIDO (COMENTADAS SEGÚN TU CONFIG) ---
  - rule: Activate Order Form
    steps:
      - intent: create_order_dtf
      - action: order_form
      - active_loop: order_form

  - rule: Submit Order Form
    condition:
      - active_loop: order_form
    steps:
      - action: order_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_submit_order_to_api

  - rule: Cancel order form with 'stop_order' or 'deny'
    condition:
      - active_loop: order_form
    steps:
      - or:
          - intent: stop_order
          - intent: deny
      - action: action_cancel_order
      - active_loop: null

  # --- REGLAS DE FAQs ---
  - rule: Respond to any FAQ
    steps:
      - intent: faq
      - action: utter_faq

  - rule: Handle any FAQ during form
    condition:
      - active_loop: order_form
    steps:
      - intent: faq
      - action: utter_faq
      - action: order_form
      - active_loop: order_form

  # --- REGLAS DE PRECIO ---
  - rule: Handle ask_price during form
    condition:
      - active_loop: order_form
    steps:
      - intent: ask_price
      - action: action_get_price
      - action: order_form
      - active_loop: order_form

  - rule: Handle ask_price OUTSIDE form
    condition:
      - active_loop: null
    steps:
      - intent: ask_price
      - action: action_get_price

  #- rule: Handle ambiguity (ask for rephrasing)
  #  steps:
  #    - intent: nlu_fallback
  #    - action: utter_ask_rephrase
  #    - action: action_listen

  # --- REGLAS DE HANDOFF (SOPORTE) ---

  # 1. Cuando se completa el formulario (envía a Laravel y pausa)
  - rule: Submit handoff form
    condition:
      - active_loop: handoff_form
    steps:
      - action: handoff_form
      - active_loop: null
      - action: action_submit_handoff

  # 2. Imprimir DTF
  - rule: Respond to ask_dtf_printing
    steps:
      - intent: ask_dtf_printing
      - action: utter_ask_dtf_printing

  # --- REGLAS DE STATUS ---
  - rule: Activate Status Form
    steps:
      - intent: check_order_status
      - action: status_form
      - active_loop: status_form

  - rule: Submit Status Form
    condition:
      - active_loop: status_form
    steps:
      - action: status_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_check_order_status

  # --- SALUDO ---
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  # ---------------------------------------------------------
  # NUEVO SISTEMA DE SOPORTE
  # ---------------------------------------------------------

  # PASO 1: Usuario pide humano -> Mostrar menú
  - rule: Show customer service options
    steps:
      - intent: request_human_handoff
      - action: utter_customer_service_options

  # PASO 2: Usuario elige "Live Chat" -> Activar formulario para pedir nombre
  # (CORREGIDO AQUÍ)
  - rule: Activate Live Chat Handoff
    steps:
      - intent: contact_option_live_chat
      - action: handoff_form
      - active_loop: handoff_form

  # OPCIÓN B: WhatsApp (Solo info)
  - rule: Show WhatsApp Info
    steps:
      - intent: contact_option_whatsapp
      - action: utter_info_whatsapp

  # OPCIÓN C: Teléfono (Solo info)
  - rule: Show Phone Info
    steps:
      - intent: contact_option_phone
      - action: utter_info_phone

  # OPCIÓN D: Email (Solo info)
  - rule: Show Email Info
    steps:
      - intent: contact_option_email
      - action: utter_info_email

  # --- REGLAS DE FALLBACK PROGRESIVO (CORREGIDAS) ---

  - rule: Handle fallback intelligently
    steps:
      - intent: nlu_fallback
      - action: action_smart_fallback

  - rule: Activate Quote Form
    steps:
      - intent: ask_quote
      - action: utter_quote_intro
      - action: quote_form
      - active_loop: quote_form

  - rule: Submit Quote Form
    condition:
      - active_loop: quote_form
    steps:
      - action: quote_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_calculate_quote

  - rule: User does not want to order after quote
    steps:
      - action: action_calculate_quote
      - intent: deny
      - action: utter_you_are_welcome # O cualquier respuesta de "De nada/Entiendo"
